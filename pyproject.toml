[project]
name = "termina"
version = "0.6.0"  # the same as Cargo.toml
description = "Make Manim Slides talks one slide at a time, with a desktop app and a Claude chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# The engine uses only the standard library. Each talk installs manim in its own environment.
dependencies = []

[dependency-groups]
dev = [
    "complexipy>=8.3.0",
    "pytest>=8.3",
]

[tool.complexipy]
# Maximum cognitive complexity of a function (the default is 15). Run: uv run complexipy .
max-complexity-allowed = 10
failed = true
# Not code of Termina: the ManimGX films of an example talk and the music of the trailer.
exclude = ["examples/manimgx-examples/films/**", "examples/trailer/music.py"]
sort = "desc"

[tool.pytest.ini_options]
testpaths = ["tests"]
